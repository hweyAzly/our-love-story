  <main class="page">
    <h1 class="page-title">💌 留言板</h1>
    <p class="page-desc">写点想对 TA 说的话吧（留言保存在浏览器本地，只有这台电脑能看到）。</p>

    <form class="msg-form" id="msg-form">
      <input type="text" id="msg-name" placeholder="你的名字" maxlength="20" required>
      <textarea id="msg-text" placeholder="想说的话…" maxlength="200" rows="4" required></textarea>
      <button type="submit" class="btn btn-primary">留下这句话</button>
    </form>

    <div class="msg-list" id="msg-list"></div>
  </main>
